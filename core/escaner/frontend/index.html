<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { font-family: "Source Sans Pro", system-ui, sans-serif; color: #31333F; }
  body { margin: 0; padding: 0; background: transparent; }
  .barra { display: flex; gap: 8px; margin-bottom: 8px; }
  select, button {
    font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #d0d3da; background: #fff; color: inherit;
  }
  select { flex: 1; min-width: 0; }
  button { cursor: pointer; white-space: nowrap; }
  #lector { width: 100%; border-radius: 10px; overflow: hidden; background: #111; min-height: 60px; }
  #lector video { width: 100% !important; height: auto !important; display: block; }
  #estado { font-size: 14px; margin-top: 6px; min-height: 20px; color: #555; }
  #estado.ok { color: #157F3C; font-weight: 600; }
  #estado.error { color: #B42318; }
</style>
</head>
<body>
  <div class="barra">
    <select id="camaras" aria-label="Cámara"></select>
    <button id="cambiar" title="Cambiar cámara">🔄 Cambiar</button>
  </div>
  <div id="lector"></div>
  <div id="estado">Pidiendo permiso para usar la cámara…</div>

<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  // --- Protocolo mínimo de componentes de Streamlit ---
  function enviar(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  function alto() { enviar("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 }); }
  function enviarValor(v) { enviar("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  var CLAVE = "qrev_camara";
  var sel = document.getElementById("camaras");
  var btn = document.getElementById("cambiar");
  var estado = document.getElementById("estado");
  var lector = null, camaras = [], ultimo = "", ultimoT = 0, iniciado = false;

  function mostrar(msg, clase) { estado.textContent = msg; estado.className = clase || ""; alto(); }
  function leerGuardada() { try { return localStorage.getItem(CLAVE); } catch (e) { return null; } }
  function guardar(id) { try { localStorage.setItem(CLAVE, id); } catch (e) {} }

  function pitido() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.value = 0.15; o.start(); o.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  function alLeer(texto) {
    var ahora = Date.now();
    if (texto === ultimo && ahora - ultimoT < 3000) return;  // evita lecturas repetidas seguidas
    ultimo = texto; ultimoT = ahora;
    pitido();
    if (navigator.vibrate) navigator.vibrate(150);
    mostrar("QR leído ✓", "ok");
    enviarValor({ text: texto, ts: ahora });
  }

  function elegirInicial() {
    var guardada = leerGuardada();
    var i = camaras.findIndex(function (c) { return c.id === guardada; });
    if (i >= 0) return i;
    i = camaras.findIndex(function (c) { return /back|rear|trás|tras|environment|posterior|trasera/i.test(c.label); });
    if (i >= 0) return i;
    return camaras.length > 1 ? camaras.length - 1 : 0;
  }

  function config() {
    return {
      fps: 10,
      qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; }
    };
  }

  async function detener() {
    if (lector && lector.isScanning) { try { await lector.stop(); } catch (e) {} }
  }

  async function iniciar(i) {
    await detener();
    sel.value = String(i);
    mostrar("Iniciando cámara…");
    try {
      await lector.start(camaras[i].id, config(), alLeer, function () {});
      guardar(camaras[i].id);
      mostrar("Apunta al QR. Lee solo.");
    } catch (e) {
      mostrar("No se pudo abrir esa cámara. Prueba con otra.", "error");
    }
    alto();
  }

  async function init() {
    lector = new Html5Qrcode("lector", { verbose: false });
    try {
      camaras = await Html5Qrcode.getCameras();
    } catch (e) {
      mostrar("Sin permiso para la cámara. Habilítala en el navegador y recarga la página.", "error");
      return;
    }
    if (!camaras.length) { mostrar("No se encontró ninguna cámara.", "error"); return; }
    sel.innerHTML = "";
    camaras.forEach(function (c, i) {
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = c.label || ("Cámara " + (i + 1));
      sel.appendChild(o);
    });
    btn.disabled = camaras.length < 2;
    sel.onchange = function () { iniciar(parseInt(sel.value, 10)); };
    btn.onclick = function () { iniciar((parseInt(sel.value, 10) + 1) % camaras.length); };
    await iniciar(elegirInicial());
  }

  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render" && !iniciado) { iniciado = true; init(); }
  });
  if (window.ResizeObserver) new ResizeObserver(alto).observe(document.body);
  enviar("streamlit:componentReady", { apiVersion: 1 });
  alto();
})();
</script>
</body>
</html>
