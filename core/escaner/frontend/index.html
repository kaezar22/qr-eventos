<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { font-family: "Source Sans Pro", system-ui, sans-serif; color: #31333F; }
  body { margin: 0; padding: 0; background: transparent; }
  .barra { display: flex; gap: 8px; margin-bottom: 8px; }
  select, button {
    font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid #d0d3da; background: #fff; color: inherit;
  }
  select { flex: 1; min-width: 0; }
  button { cursor: pointer; white-space: nowrap; }
  #lector { width: 100%; border-radius: 10px; overflow: hidden; background: #111; min-height: 60px; }
  #lector video { width: 100% !important; height: auto !important; display: block; }
  #estado { font-size: 14px; margin-top: 6px; min-height: 20px; color: #555; }
  #estado.ok { color: #157F3C; font-weight: 600; }
  #estado.error { color: #B42318; }
</style>
</head>
<body>
  <div class="barra">
    <select id="camaras" aria-label="Cámara"></select>
    <button id="cambiar" title="Cambiar cámara">🔄 Cambiar</button>
  </div>
  <div id="lector"></div>
  <div id="estado">Pidiendo permiso para usar la cámara…</div>

<script src="html5-qrcode.min.js"></script>
<script>
(function () {
  // --- Protocolo mínimo de componentes de Streamlit ---
  function enviar(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }
  function alto() { enviar("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 }); }
  function enviarValor(v) { enviar("streamlit:setComponentValue", { value: v, dataType: "json" }); }

  var CLAVE = "qrev_camara_v2";
  var AUTO = {
    "auto-env": { etiqueta: "📷 Trasera (automática)", fuentes: [{ facingMode: { exact: "environment" } }, { facingMode: "environment" }] },
    "auto-user": { etiqueta: "🤳 Frontal (automática)", fuentes: [{ facingMode: { exact: "user" } }, { facingMode: "user" }] }
  };
  var sel = document.getElementById("camaras");
  var btn = document.getElementById("cambiar");
  var estado = document.getElementById("estado");
  var lector = null, actual = null, ultimo = "", ultimoT = 0, iniciado = false, ocupado = false, ultimoError = null;

  function esperar(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function mostrar(msg, clase) { estado.textContent = msg; estado.className = clase || ""; alto(); }
  function leerGuardada() { try { return localStorage.getItem(CLAVE); } catch (e) { return null; } }
  function guardar(v) { try { localStorage.setItem(CLAVE, v); } catch (e) {} }

  function pitido() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.value = 0.15; o.start(); o.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }

  function alLeer(texto) {
    var ahora = Date.now();
    if (texto === ultimo && ahora - ultimoT < 3000) return;  // evita lecturas repetidas seguidas
    ultimo = texto; ultimoT = ahora;
    pitido();
    if (navigator.vibrate) navigator.vibrate(150);
    mostrar("QR leído ✓", "ok");
    enviarValor({ text: texto, ts: ahora });
  }

  function config() {
    return {
      fps: 10,
      qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; }
    };
  }

  function explicar(e) {
    var txt = String((e && (e.name || e.message)) || e || "");
    var m = txt.match(/(\w+Error)/);
    var nombre = m ? m[1] : (txt.slice(0, 60) || "error desconocido");
    var pista = {
      NotReadableError: "La cámara está ocupada (otra app o pestaña). Ciérralas y recarga.",
      TrackStartError: "La cámara está ocupada (otra app o pestaña). Ciérralas y recarga.",
      OverconstrainedError: "Este celular no deja abrir esa cámara directamente. Usa \"Trasera (automática)\".",
      NotAllowedError: "No hay permiso para la cámara. Habilítalo en el navegador y recarga.",
      NotFoundError: "No se encontró esa cámara."
    }[nombre] || "Prueba con otra opción de la lista.";
    return pista + " (" + nombre + ")";
  }

  async function detener() {
    if (!lector) return;
    try { if (lector.isScanning) await lector.stop(); } catch (e) {}
    try { lector.clear(); } catch (e) {}
    lector = null;
  }

  // Abre una cámara probando cada fuente; suelta la anterior y espera antes de abrir.
  async function abrirFuentes(fuentes) {
    await detener();
    await esperar(400);
    for (var i = 0; i < fuentes.length; i++) {
      for (var intento = 0; intento < 2; intento++) {
        var l = new Html5Qrcode("lector", { verbose: false });
        try {
          await l.start(fuentes[i], config(), alLeer, function () {});
          lector = l;
          return true;
        } catch (e) {
          ultimoError = e;
          try { l.clear(); } catch (e2) {}
          await esperar(700);
        }
      }
    }
    return false;
  }

  function fuentesDe(valor) { return AUTO[valor] ? AUTO[valor].fuentes : [valor]; }

  async function abrir(valor) {
    if (ocupado) return false;
    ocupado = true; sel.disabled = true; btn.disabled = true;
    mostrar("Abriendo cámara…");
    var ok = await abrirFuentes(fuentesDe(valor));
    ocupado = false; sel.disabled = false; btn.disabled = sel.options.length < 2;
    if (ok) {
      actual = valor; sel.value = valor; guardar(valor);
      mostrar("Apunta al QR. Lee solo.");
    }
    alto();
    return ok;
  }

  async function llenarLista() {
    var dispositivos = [];
    try {
      dispositivos = (await navigator.mediaDevices.enumerateDevices())
        .filter(function (d) { return d.kind === "videoinput"; });
    } catch (e) {}
    sel.innerHTML = "";
    Object.keys(AUTO).forEach(function (k) {
      var o = document.createElement("option"); o.value = k; o.textContent = AUTO[k].etiqueta; sel.appendChild(o);
    });
    dispositivos.forEach(function (d, i) {
      if (!d.deviceId) return;
      var o = document.createElement("option");
      o.value = d.deviceId; o.textContent = d.label || ("Cámara " + (i + 1));
      sel.appendChild(o);
    });
    if (actual) sel.value = actual;
    btn.disabled = sel.options.length < 2;
  }

  async function cambiarA(valor) {
    var anterior = actual;
    if (await abrir(valor)) return;
    var msg = "No se pudo abrir esa cámara. " + explicar(ultimoError);
    if (anterior && anterior !== valor && await abrir(anterior)) {
      mostrar(msg, "error");
    } else {
      sel.value = valor;
      mostrar(msg, "error");
    }
  }

  async function init() {
    var guardada = leerGuardada();
    var ok = false;
    if (guardada) ok = await abrir(guardada);
    if (!ok) ok = await abrir("auto-env");
    if (!ok) ok = await abrir("auto-user");
    await llenarLista();   // después del permiso: los nombres de las cámaras ya están disponibles
    if (!ok) { mostrar("No se pudo abrir la cámara. " + explicar(ultimoError), "error"); return; }
    sel.value = actual;
  }

  sel.onchange = function () { cambiarA(sel.value); };
  btn.onclick = function () {
    var i = (sel.selectedIndex + 1) % sel.options.length;
    cambiarA(sel.options[i].value);
  };

  window.addEventListener("message", function (ev) {
    if (ev.data && ev.data.type === "streamlit:render" && !iniciado) { iniciado = true; init(); }
  });
  if (window.ResizeObserver) new ResizeObserver(alto).observe(document.body);
  enviar("streamlit:componentReady", { apiVersion: 1 });
  alto();
})();
</script>
</body>
</html>
